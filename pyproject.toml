[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kdp-pipeline"
version = "0.1.0"
description = "Local-first AI-empowered KDP authoring pipeline"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kdp = "kdp_pipeline.cli.app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
